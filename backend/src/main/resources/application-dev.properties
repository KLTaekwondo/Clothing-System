# 开发环境数据库（本地 MySQL）
spring.datasource.url=jdbc:mysql://localhost:3306/ClothingSystem?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# 开发环境日志（更详细）
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# 开发环境 Cookie 安全配置（关闭 Secure，允许 HTTP）
server.servlet.session.cookie.secure=false
# SameSite 可以保留 Lax，不影响本地
server.servlet.session.cookie.same-site=Lax

# 开发环境日志级别
logging.level.com.superkl.backend=DEBUG