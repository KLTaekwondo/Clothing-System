# MySQL 也在同一台服务器上，直接用 localhost
spring.datasource.url=jdbc:mysql://localhost:3306/ClothingSystem?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 生产环境日志（关闭 SQL 打印）
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 生产环境 Cookie 安全配置
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=Lax

# 生产环境日志级别
logging.level.com.superkl.backend=WARN

# 生产环境连接池
spring.datasource.hikari.maximum-pool-size=20