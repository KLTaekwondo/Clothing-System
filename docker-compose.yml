# 一键启动：MySQL + Redis + 后端 + 前端
# 用法：docker compose up -d --build
# 访问：http://localhost:5173 （前端 nginx 80 映射到宿主机 5173）
services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:5.7
    container_name: clothing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ClothingSystem
      # 注意：MYSQL_CHARSET 不是官方变量！必须用 command 指定 utf8mb4，否则库默认 latin1，中文变 ????
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行初始化脚本（建表 + 灌默认账号），重复启动不会重复执行（INSERT IGNORE 幂等）
      - ./backend/src/main/resources/init-data.sql:/docker-entrypoint-initdb.d/01-init-data.sql:ro
    ports:
      # 宿主机 3307 → 容器 3306（避免与本机已装的 MySQL 3306 冲突）
      # 后端容器通过容器名 mysql:3306 访问，不受宿主机端口影响
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Redis ----------
  redis:
    image: redis:7
    container_name: clothing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- 后端 ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: clothing-backend
    environment:
      # 生产环境配置（application-prod.properties 里全是 ${ENV}）
      # ⚠️ 数据库/Redis 必须用容器名，不能是 localhost！
      # Spring Boot 环境变量可覆盖 properties（relaxed binding）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ClothingSystem?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis
      DB_USERNAME: root
      DB_PASSWORD: "123456"
      JWT_SECRET: "Clothing-System-Build-#2026-Secret@adjiwavbp@xmcvp@1215"
      REDIS_PASSWORD: ""
      # AI 可选：不设置则 AI 功能禁用（@ConditionalOnProperty 生效）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  # ---------- 前端 ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: clothing-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
